<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Users | UPDF Admin</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="admin-layout">
  <aside class="sidebar">
    <div class="sidebar-brand"><div class="brand-text"><strong>UPDF RECRUIT</strong><small>Admin Portal</small></div></div>
    <nav class="sidebar-nav">
      <a href="/admin/dashboard">Dashboard</a>
      <a href="/admin/applications">Applications</a>
      <a href="/admin/users" class="active">Manage Users</a>
      <a href="#" onclick="doLogout()">Logout</a>
    </nav>
  </aside>
  <main class="admin-main">
    <div class="admin-topbar">
      <h1>Manage Admin Users</h1>
      <button onclick="document.getElementById('addModal').classList.add('show')" class="btn btn-green btn-sm">+ Add User</button>
    </div>
    <div class="admin-content">
      <div class="admin-table-wrapper">
        <table class="data-table">
          <thead><tr><th>ID</th><th>Username</th><th>Email</th><th>Role</th><th>Status</th><th>Last Login</th><th>Created</th><th>Actions</th></tr></thead>
          <tbody id="usersTable"><tr><td colspan="8" style="text-align:center;padding:30px;color:#666">Loading...</td></tr></tbody>
        </table>
      </div>
    </div>
  </main>
</div>

<div class="modal-overlay" id="addModal">
  <div class="modal-box" style="max-width:450px">
    <div class="modal-header"><h3>Add Admin User</h3><button class="modal-close" onclick="document.getElementById('addModal').classList.remove('show')">X</button></div>
    <div class="modal-body">
      <div class="form-group" style="margin-bottom:14px"><label class="form-label">Username</label><input type="text" class="form-control" id="newUsername"></div>
      <div class="form-group" style="margin-bottom:14px"><label class="form-label">Email</label><input type="email" class="form-control" id="newEmail"></div>
      <div class="form-group" style="margin-bottom:14px"><label class="form-label">Password</label><input type="password" class="form-control" id="newPassword"></div>
      <div class="form-group" style="margin-bottom:14px"><label class="form-label">Role</label>
        <select class="form-control" id="newRole">
          <option>Officer</option><option>Viewer</option><option>Superadmin</option>
        </select>
      </div>
    </div>
    <div class="modal-footer">
      <button onclick="document.getElementById('addModal').classList.remove('show')" class="btn" style="background:#eee;color:#333;border-color:#ccc">Cancel</button>
      <button onclick="addUser()" class="btn btn-green">Add User</button>
    </div>
  </div>
</div>

<div class="toast-container" id="toastContainer"></div>
<script>
function loadUsers(){
  fetch('/admin/api/users').then(r=>r.json()).then(data=>{
    if(!data.success){window.location.href='/admin/login';return;}
    const tbody=document.getElementById('usersTable');
    tbody.innerHTML=data.data.map(u=>`<tr>
      <td>${u.id}</td>
      <td><strong>${u.username}</strong></td>
      <td>${u.email}</td>
      <td><span class="badge badge-${u.role==='Superadmin'?'green':'blue'}">${u.role}</span></td>
      <td>${u.is_active?'<span style="color:var(--success)">Active</span>':'<span style="color:var(--danger)">Inactive</span>'}</td>
      <td style="font-size:12px">${u.last_login?new Date(u.last_login).toLocaleString('en-UG'):'-'}</td>
      <td style="font-size:12px">${new Date(u.created_at).toLocaleDateString('en-UG')}</td>
      <td>
        <button onclick="toggleUser(${u.id},${u.is_active?0:1})" class="btn btn-sm" style="background:#eee;color:#333;border-color:#ccc">${u.is_active?'Deactivate':'Activate'}</button>
      </td>
    </tr>`).join('');
  });
}

function addUser(){
  const username=document.getElementById('newUsername').value.trim();
  const email=document.getElementById('newEmail').value.trim();
  const password=document.getElementById('newPassword').value;
  const role=document.getElementById('newRole').value;
  if(!username||!email||!password||!role){showToast('All fields required.','error');return;}
  fetch('/admin/api/users',{
    method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({username,email,password,role})
  }).then(r=>r.json()).then(data=>{
    if(data.success){showToast('User created.','success');document.getElementById('addModal').classList.remove('show');loadUsers();}
    else showToast(data.error||'Error.','error');
  });
}

function toggleUser(id,is_active){
  fetch('/admin/api/users/'+id,{
    method:'PATCH',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({role:'Officer',is_active})
  }).then(r=>r.json()).then(data=>{
    if(data.success)loadUsers();
    else showToast('Error updating user.','error');
  });
}

function doLogout(){fetch('/auth/logout',{method:'POST'}).then(()=>window.location.href='/admin/login');}

function showToast(message,type='info'){
  const container=document.getElementById('toastContainer');
  const toast=document.createElement('div');
  toast.className='toast '+type;
  toast.innerHTML='<span>'+message+'</span>';
  container.appendChild(toast);
  setTimeout(()=>toast.remove(),4000);
}
loadUsers();
</script>
</body>
</html>
